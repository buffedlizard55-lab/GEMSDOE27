name: fetch-gdr-external-layers

# Why this workflow exists
# -----------------------
# The agent sandbox can only reach github.com / api.github.com / pypi.org / codeload.github.com.
# gdr.openei.org, mrdata.usgs.gov and sciencebase.usgs.gov are unreachable from it, so any hypothesis
# that needs an official external layer cannot be *verified as obtainable* from inside a session.
# A GitHub Actions runner can reach them. This workflow is that bridge: it downloads the specific
# free official files named in registry/sources.json, verifies each against a SHA-256 that was
# recorded by an independent runner on 2026-09-30 (sibling repository 16GEMSDOE,
# evidence/ci/external_verification.json), inventories them, clips them to the competition footprint
# and uploads the result as a run artifact.
#
# It commits exactly ONE small file back to the repository - evidence/external_layer_inventory.json -
# because the agent sandbox cannot read run logs or download artifacts (both live on hosts outside its
# allowlist: results-receiver.actions.githubusercontent.com and *.blob.core.windows.net). Committing the
# inventory is what makes the result verifiable from a session with `gh api`. That path is not in the
# push trigger's `paths:` filter, so the commit cannot re-trigger this workflow. It never contacts
# drivendata.org
# (the competition Terms of Use prohibit robots/automatic access; see scripts/refresh_source_feed.py).
#
# Retrieve the artifact from a session with:
#   gh run list --workflow=fetch-gdr-external-layers.yml
#   gh run download <run-id> --name gdr-external-layers --dir /tmp/gdr
#
# Manual review links (open in a browser, do not automate):
#   GDR 1391 (INGENIOUS regional data, DOI 10.15121/1881483) https://gdr.openei.org/submissions/1391
#   USGS State Geologic Map Compilation                       https://mrdata.usgs.gov/geology/state/
#   Siler et al. 2022 (DOI 10.5066/P9YL58W6)                  https://doi.org/10.5066/P9YL58W6

on:
  # Dispatching this workflow needs `actions: write`, which the agent's token does not have
  # (HTTP 403 on POST /actions/workflows/<id>/dispatches, recorded 2026-10-03). The push trigger below
  # is path-filtered to this workflow and its script, so merging a change to either runs the fetch
  # without anyone needing dispatch permission - and it still runs on demand for anyone who has it.
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-gdr-external-layers.yml"
      - "scripts/fetch_external_layers.py"
  workflow_dispatch:
    inputs:
      datasets:
        description: "Comma-separated dataset keys to fetch (all | paleo,probes,volcanics)"
        required: true
        default: "paleo,probes,volcanics"
      availability_only:
        description: "Also HEAD-check (no download) the larger sources and record status"
        required: false
        default: "true"

permissions:
  contents: write   # needed only to commit evidence/external_layer_inventory.json back to main:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install geospatial readers
        run: |
          python -m pip install --upgrade pip
          # pyogrio ships GDAL wheels, so FileGDB and shapefile both read without apt packages
          python -m pip install pyogrio shapely pyproj pandas

      - name: Download, hash-verify, inventory and clip
        env:
          DATASETS: ${{ github.event.inputs.datasets || 'paleo,probes,volcanics' }}
          AVAIL_ONLY: ${{ github.event.inputs.availability_only || 'true' }}
        run: |
          set -o pipefail   # a verification failure must fail the job, not be swallowed by tee
          mkdir -p /tmp/gdr/out
          python scripts/fetch_external_layers.py \
            --datasets "$DATASETS" \
            --availability-only "$AVAIL_ONLY" \
            --out /tmp/gdr/out \
            --pins /tmp/gdr/pins.json \
            2>&1 | tee /tmp/gdr/log.txt

      - name: Show inventory in the run log
        if: always()
        run: |
          echo "===== inventory ====="
          cat /tmp/gdr/out/inventory.json || echo "(no inventory produced)"

      - name: Commit the inventory so a session can read it with gh api
        if: always()
        run: |
          if [ ! -f /tmp/gdr/out/inventory.json ]; then
            echo "no inventory produced; nothing to commit"; exit 0
          fi
          cp /tmp/gdr/out/inventory.json evidence/external_layer_inventory.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/external_layer_inventory.json
          if git diff --cached --quiet; then
            echo "inventory unchanged; nothing to commit"
          else
            git commit -m "evidence: external-layer fetch inventory (hashes, layer schemas, in-footprint counts)

Written by .github/workflows/fetch-gdr-external-layers.yml on the runner, because run logs and
artifacts are hosted outside the agent sandbox's allowlist and cannot be read from a session.
Every dataset row carries the pin it was checked against and whether it matched."
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdr-external-layers
          path: |
            /tmp/gdr/out/inventory.json
            /tmp/gdr/out/*.csv
            /tmp/gdr/log.txt
          if-no-files-found: warn
          retention-days: 90
