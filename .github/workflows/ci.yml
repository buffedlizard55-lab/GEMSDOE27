name: CI (tests, lint, site build)

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      # Readiness byte checks require the hash-pinned template/labels. These are
      # restored only from the owner GitHub mirror; never from DrivenData.
      - run: python scripts/restore_data.py
      - run: ruff check src scripts tests
      - run: python -m pytest -q
      - name: Site builds from JSON only and is unchanged
        run: |
          python scripts/build_site.py
          git diff --exit-code -- docs index.html EXECUTIVE_SUMMARY.md
