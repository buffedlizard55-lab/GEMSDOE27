name: Rebuild site when registries change

# The site is rendered from JSON only (no rasters). When the owner records a score in registry/live_scores.json
# (or any registry file changes) on main, this rebuilds docs/*.html and the derived knowledge docs.
on:
  push:
    branches: [main]
    paths:
      - 'registry/live_scores.json'
      - 'registry/irregularities.json'
      - 'registry/sources.json'
      - 'registry/hypotheses.json'
      - 'scripts/build_site.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/build_site.py
      - name: Commit rebuilt pages
        run: |
          set -euo pipefail
          git config user.name 'GEMS site build'
          git config user.email 'gems-site@users.noreply.github.com'
          git add docs knowledge index.html
          git commit -m "site: rebuild from registries" || exit 0
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep $((i*4)); done
          exit 1
